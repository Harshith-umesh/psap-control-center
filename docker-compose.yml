services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pasp-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./kubeconfigs:/app/kubeconfigs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/pasp_control_center.db
      - KUBECONFIG_STORAGE_PATH=/app/kubeconfigs
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-admin-password}
      - USER_USERNAME=${USER_USERNAME:-user}
      - USER_PASSWORD=${USER_PASSWORD:-change-user-password}
      - HEARTH_ENABLED=${HEARTH_ENABLED:-true}
      - HEARTH_NAMESPACE=${HEARTH_NAMESPACE:-hearth}
      - BILLING_CSV_STORAGE_PATH=/app/data/billing_csvs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MLFLOW_BASE_URL=${MLFLOW_BASE_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      default:
        aliases:
          - psap-control-center-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pasp-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
  kubeconfigs:
