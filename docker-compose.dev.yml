services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pasp-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./kubeconfigs:/app/kubeconfigs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/pasp_control_center.db
      - KUBECONFIG_STORAGE_PATH=/app/kubeconfigs
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-admin-password}
      - USER_USERNAME=${USER_USERNAME:-user}
      - USER_PASSWORD=${USER_PASSWORD:-change-user-password}
      - HEARTH_ENABLED=${HEARTH_ENABLED:-true}
      - HEARTH_NAMESPACE=${HEARTH_NAMESPACE:-hearth}
      - BILLING_CSV_STORAGE_PATH=/app/data/billing_csvs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pasp-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
